name = "lilc-agent"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APPLE_BUNDLE_ID = "app.lilc"
APPLE_ENVIRONMENT = "Production"
PAID_AGENT_ENABLED = "false"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "MOBILE_AGENT_LEDGER"
class_name = "MobileAgentLedger"

[[migrations]]
tag = "v1-mobile-agent"
new_sqlite_classes = ["MobileAgentLedger"]
