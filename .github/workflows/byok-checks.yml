name: BYOK checks
on:
  pull_request:
    paths: ['lilC/**', 'lilCTests/**', 'lilC.xcodeproj/**', 'services/agent-worker/**', 'scripts/**', '.github/workflows/byok-checks.yml']
permissions:
  contents: read
concurrency:
  group: byok-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/agent-worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: services/agent-worker
      - run: npm run typecheck && npm test
        working-directory: services/agent-worker
      - run: npx wrangler deploy --dry-run --outdir /tmp/byok-worker
        working-directory: services/agent-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Execute actual native Python policy regression checks
        run: python3 scripts/test-python-safety.py
      - name: Execute packaged SymPy through the native bridge without FFI
        run: |
          python3 scripts/fetch-math-assets.py
          python3 scripts/test-math-native.py
  swift-and-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Provider state, keychain and transport regression tests
        run: bash scripts/test-byok.sh
      - name: Existing math and model-selection regressions
        run: |
          bash scripts/test-math-domain.sh
          bash scripts/test-model-selection.sh
      - name: Swift syntax and Xcode project validation
        run: |
          plutil -lint lilC.xcodeproj/project.pbxproj
          plutil -lint lilC/Resources/PrivacyInfo.xcprivacy
          find lilC -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
          python3 scripts/check-editor-project.py
      - name: Fetch existing pinned build assets
        run: |
          bash scripts/fetch-agent-assets.sh
          bash scripts/fetch-python-assets.sh
          python3 scripts/fetch-math-assets.py
      - name: Compile the iPhone application and BYOK unit tests
        run: xcodebuild -project lilC.xcodeproj -scheme lilC -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath /tmp/edsger-byok-derived CODE_SIGNING_ALLOWED=NO build-for-testing -only-testing:lilCTests/BYOKTests
      - name: Build the existing pinned llama simulator slice
        run: bash scripts/build-llama-simulator.sh
      - name: Execute bundled math regression on an iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcodebuild -project lilC.xcodeproj -scheme lilC -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath /tmp/edsger-math-simulator CODE_SIGNING_ALLOWED=NO test -only-testing:lilCTests/BYOKTests/bundledMathEngineEvaluatesDefiniteIntegralWithoutFFI
